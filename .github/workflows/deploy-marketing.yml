name: Deploy marketing site

on:
  push:
    branches: [main]
    paths:
      - apps/marketing/**
      - packages/auth/**
      - bun.lock
      - .github/workflows/deploy-marketing.yml
  workflow_dispatch:

permissions:
  contents: read

# Deploy one build at a time and never cancel one that is already publishing.
concurrency:
  group: deploy-marketing
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      # wrangler.jsonc runs `bun run build` before it uploads ./dist.
      - run: bun run deploy
        working-directory: apps/marketing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
