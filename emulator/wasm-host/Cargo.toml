[package]
name = "vex-v5-wasm-host"
version = "0.1.0"
edition = "2021"
description = "Browser host for the vex-v5-qemu kernel, protocol, and display renderer."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bincode = { version = "2.0.1", features = ["derive"] }
bytemuck = "1"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
wasm-bindgen = "=0.2.100"
vex-v5-display-simulator = { path = "../display" }
vex-v5-qemu-protocol = { path = "../protocol" }

[lints]
workspace = true
